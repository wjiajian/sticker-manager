[package]
name = "sticker-core"
version = "0.1.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json = "1"
whoami = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
opendal = { version = "0.59.5", default-features = false, features = ["services-webdav", "services-s3", "executors-tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
http = "1"
httpdate = "1"
url = "2"
futures-util = "0.3"
percent-encoding = "2"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8.44"

[dev-dependencies]
png = "0.18"
