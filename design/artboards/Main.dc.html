<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三栏仓库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1F1F}a:hover{color:#B8431C}
.nav,.btn,.tile,.chip{transition:transform 500ms cubic-bezier(0.22,1,0.36,1),opacity 300ms cubic-bezier(0.22,1,0.36,1),background-color 300ms cubic-bezier(0.22,1,0.36,1)}
.nav:hover{background-color:#EAE8E1 !important}
.btn:hover,.chip:hover{opacity:0.82}
.btn:active,.tile:active,.nav:active,.chip:active{transform:scale(0.98)}
.tile:hover{transform:translateY(-2px)}
.nav:focus-visible,.btn:focus-visible,.tile:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid #E8572A;outline-offset:2px}
input::placeholder{color:#6B6A66}
@media (prefers-reduced-motion: reduce){.nav,.btn,.tile,.chip{transition:opacity 300ms cubic-bezier(0.22,1,0.36,1)}.tile:hover,.btn:active,.tile:active,.nav:active,.chip:active{transform:none}}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #FFFFFF; color: #1F1F1F; font-family: Manrope, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 20px">

<header style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: #F5F4F0; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 8px; width: 200px">
<span style="width: 12px; height: 12px; border-radius: 9999px; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 9999px; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 9999px; background: #28C840"></span>
</div>
<label style="flex: 1 1 280px; max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #E2E0D9; border-radius: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.search}}"></path></svg>
<input aria-label="搜索表情" placeholder="搜索表情、标签或配文" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: #1F1F1F">
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">⌘K</span>
</label>
<div style="display: flex; align-items: center; gap: 8px">
<button class="btn" type="button" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #E2E0D9; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1F1F1F; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E8A4C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.cloudok}}"></path></svg>
已同步
</button>
<button class="btn" type="button" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 0; border-radius: 8px; background: #1F1F1F; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>
导入表情
</button>
</div>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap">

<nav aria-label="仓库导航" style="flex: 1 0 216px; display: flex; flex-direction: column; gap: 24px; padding: 8px 12px 16px; background: #F5F4F0; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: #6B6A66">仓库</span>
<sc-for list="{{lib}}" as="n" hint-placeholder-count="4">
<button class="nav" type="button" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 8px; border: 0; border-radius: 8px; background: {{n.bg}}; font: inherit; color: #1F1F1F; text-align: left; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span style="flex: 1; font-weight: {{n.weight}}">{{n.label}}</span>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">{{n.count}}</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #6B6A66">标签分组</span>
<button class="btn" type="button" aria-label="新建标签" style="display: flex; padding: 2px; border: 0; border-radius: 4px; background: transparent; color: #6B6A66; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.plus}}"></path></svg>
</button>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<button class="nav" type="button" style="display: flex; align-items: center; gap: 4px; width: 100%; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; color: #4A4945; text-align: left; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.chev}}"></path></svg>
{{g.name}}
</button>
<sc-for list="{{g.tags}}" as="t" hint-placeholder-count="3">
<button class="nav" type="button" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 8px 4px 24px; border: 0; border-radius: 8px; background: transparent; font: inherit; color: #1F1F1F; text-align: left; cursor: pointer">
<span style="width: 8px; height: 8px; border-radius: 9999px; background: {{t.dot}}"></span>
<span style="flex: 1">{{t.n}}</span>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">{{t.c}}</span>
</button>
</sc-for>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #FFFFFF; border: 1px solid #E2E0D9; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 8px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E8A4C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.cloudok}}"></path></svg>
WebDAV 已同步
</div>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">nas.home.lan/dav/stickers</span>
<div style="height: 4px; border-radius: 9999px; background: #EAE8E1; overflow: hidden"><div style="width: 38%; height: 4px; background: #1F1F1F"></div></div>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">2 分钟前 · 3 台设备 · 1.24 GB</span>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px; padding: 24px 32px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600">全部表情</h1>
<span style="color: #6B6A66">1,284 张</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<div style="display: flex; gap: 2px; padding: 2px; background: #F3F2EE; border-radius: 8px">
<button class="chip" type="button" style="padding: 4px 12px; border: 0; border-radius: 6px; background: #FFFFFF; font: inherit; font-weight: 600; color: #1F1F1F; cursor: pointer">全部</button>
<button class="chip" type="button" style="padding: 4px 12px; border: 0; border-radius: 6px; background: transparent; font: inherit; color: #4A4945; cursor: pointer">静态</button>
<button class="chip" type="button" style="padding: 4px 12px; border: 0; border-radius: 6px; background: transparent; font: inherit; color: #4A4945; cursor: pointer">动图</button>
</div>
<button class="btn" type="button" style="display: flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid #E2E0D9; border-radius: 8px; background: #FFFFFF; font: inherit; color: #1F1F1F; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.sort}}"></path></svg>
最近添加
</button>
</div>
</div>

<section aria-label="最近使用" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600">最近使用</h2>
<button class="chip" type="button" style="padding: 0; border: 0; background: transparent; font: inherit; font-size: 12px; line-height: 16px; color: #4A4945; cursor: pointer">查看全部 48 张</button>
</div>
<div style="display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{recent}}" as="s" hint-placeholder-count="10">
<button class="tile" type="button" aria-label="{{s.name}}" onClick="{{s.pick}}" style="flex: 0 0 64px; width: 64px; height: 64px; padding: 8px; border: 0; border-radius: 8px; background: #F3F2EE; cursor: pointer; box-shadow: {{s.ring}}">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" aria-hidden="true">
<path d="{{s.ears}}" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5"></circle>
<path d="{{s.blush}}" fill="#FF7A9A" opacity="0.55"></path>
<path d="{{s.e}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{s.m}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</sc-for>
</div>
</section>

<section aria-label="全部表情" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px">
<sc-for list="{{grid}}" as="s" hint-placeholder-count="24">
<button class="tile" type="button" aria-label="{{s.name}}" onClick="{{s.pick}}" style="position: relative; width: 100%; aspect-ratio: 1; padding: 16px; border: 0; border-radius: 12px; background: #F3F2EE; cursor: pointer; box-shadow: {{s.ring}}">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" aria-hidden="true">
<path d="{{s.ears}}" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5"></circle>
<path d="{{s.blush}}" fill="#FF7A9A" opacity="0.55"></path>
<path d="{{s.e}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{s.m}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<sc-if value="{{s.hasCap}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 2px 8px; border-radius: 4px; background: #1F1F1F; color: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap">{{s.cap}}</span></sc-if>
<sc-if value="{{s.gif}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 8px; right: 8px; padding: 0 4px; border-radius: 4px; background: #FFFFFF; color: #1F1F1F; font-size: 12px; line-height: 16px; font-weight: 600">GIF</span></sc-if>
</button>
</sc-for>
</section>
</main>

<aside aria-label="表情详情" style="flex: 1 0 264px; display: flex; flex-direction: column; gap: 24px; padding: 24px; background: #FAFAF8; box-sizing: border-box">
<div style="position: relative; aspect-ratio: 1; padding: 32px; border-radius: 16px; background: #F0EEE8; box-sizing: border-box">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" role="img" aria-label="{{cur.name}}">
<path d="{{cur.ears}}" fill="{{cur.c}}" stroke="#1F1F1F" stroke-width="2" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{cur.c}}" stroke="#1F1F1F" stroke-width="2"></circle>
<path d="{{cur.blush}}" fill="#FF7A9A" opacity="0.55"></path>
<path d="{{cur.e}}" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{cur.m}}" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<sc-if value="{{cur.gif}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 12px; right: 12px; padding: 0 4px; border-radius: 4px; background: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 600">GIF</span></sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 600">{{cur.name}}</h2>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">240 × 240 · {{cur.size}} · 9月12日添加</span>
</div>

<div style="display: flex; gap: 8px">
<button class="btn" type="button" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border: 0; border-radius: 8px; background: {{accent}}; font: inherit; font-size: 16px; line-height: 24px; font-weight: 600; color: #FFFFFF; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.copy}}"></path></svg>
复制
</button>
<button class="btn" type="button" aria-label="在访达中显示" style="display: flex; align-items: center; padding: 8px 12px; border: 1px solid #E2E0D9; border-radius: 8px; background: #FFFFFF; color: #1F1F1F; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.folder}}"></path></svg>
</button>
<button class="btn" type="button" aria-label="收藏" style="display: flex; align-items: center; padding: 8px 12px; border: 1px solid #E2E0D9; border-radius: 8px; background: #FFFFFF; color: #1F1F1F; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.star}}"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #6B6A66">标签</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{curTags}}" as="t" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 9999px; background: #FFFFFF; border: 1px solid #E2E0D9; font-size: 12px; line-height: 16px">
<span style="width: 8px; height: 8px; border-radius: 9999px; background: {{t.dot}}"></span>{{t.n}}
</span>
</sc-for>
<button class="chip" type="button" style="padding: 2px 8px; border: 1px dashed #B9B7B0; border-radius: 9999px; background: transparent; font: inherit; font-size: 12px; line-height: 16px; color: #4A4945; cursor: pointer">添加标签</button>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #6B6A66">配文</span>
<input value="{{capText}}" onChange="{{onCap}}" placeholder="添加配文，可被搜索" style="padding: 8px 12px; border: 1px solid #E2E0D9; border-radius: 8px; background: #FFFFFF; font: inherit; color: #1F1F1F">
</label>

<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 12px; line-height: 16px">
<dt style="color: #6B6A66">使用次数</dt><dd style="margin: 0">{{cur.uses}} 次 · 3 台设备合计</dd>
<dt style="color: #6B6A66">上次使用</dt><dd style="margin: 0">今天 14:08</dd>
<dt style="color: #6B6A66">同步</dt><dd style="margin: 0">已在 3 台设备上</dd>
</dl>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4945" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
<span style="flex: 1">{{d.name}}</span>
<span style="color: #6B6A66">{{d.when}}</span>
</div>
</sc-for>
</div>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#15803D","#1F1F1F"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  mk(k) {
    const C = ['#FFC94A','#FF8A5B','#7CC6FE','#9BE38E','#F49AC2','#C7B8FF','#EDEBE4','#C99A6B'];
    const EY = ['M25 30v3M39 30v3','M21 33q4 -5 8 0M35 33q4 -5 8 0','M21 32h8M35 32h8','M22 29l6 6M28 29l-6 6M36 29l6 6M42 29l-6 6','M25 30v3M35 33q4 -5 8 0','M21 31q4 3 8 0M35 31q4 3 8 0'];
    const MO = ['M25 42q7 7 14 0','M24 41h16q-1 8 -8 8t-8 -8Z','M27 45h10','M29 45a3 3 0 1 0 6 0a3 3 0 1 0 -6 0','M25 48q7 -6 14 0','M23 45q2.25 -3 4.5 0t4.5 0t4.5 0t4.5 0'];
    const EA = ['','M13 28l3 -18l13 9ZM51 28l-3 -18l-13 9Z','M11 20a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M39 20a7 7 0 1 0 14 0a7 7 0 1 0 -14 0','M20 18q-4 -16 3 -16q5 0 4 16ZM44 18q4 -16 -3 -16q-5 0 -4 16Z'];
    const AN = ['豆豆','猫猫','熊熊','兔兔'];
    const AC = ['点头','比心','发呆','鼓掌','叹气','转圈','偷看','躺平','捂脸','举手'];
    const CAP = ['收到','好耶','在吗','累了','绝了','冲','晚安','哈哈哈','？','OK','救命','摸鱼中','可以','不懂','谢谢老板','溜了'];
    const MOOD = ['开心','开心','无语','生气','开心','无语'];
    const SCENE = ['回复','打工','晚安'];
    const a = (k * 3) % 4, ei = (k * 5 + 1) % 6, gif = k % 5 === 2;
    return {
      k: k, c: C[(k * 3) % 8], e: EY[ei], m: MO[(k + 2) % 6], ears: EA[a],
      blush: k % 3 === 0 ? 'M15 41a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M43 41a3 3 0 1 0 6 0a3 3 0 1 0 -6 0' : '',
      cap: CAP[(k * 5) % 16], hasCap: k % 4 === 1, gif: gif,
      name: AN[a] + AC[(k * 7) % 10] + (gif ? '.gif' : '.png'),
      tags: [AN[a], MOOD[ei], SCENE[k % 3]],
      uses: (k * 13) % 61 + 4,
      size: gif ? ((k * 37) % 300 + 120) + ' KB' : ((k * 17) % 60 + 18) + ' KB'
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const sel = (this.state && this.state.sel != null) ? this.state.sel : 7;
    const ic = {
      search: 'M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15ZM16 16l5 5',
      grid: 'M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z',
      clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 7v5l3 2',
      star: 'M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8Z',
      inbox: 'M4 13h4l1.5 3h5l1.5-3h4M4 13l2.5-8h11L20 13v6H4Z',
      trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
      plus: 'M12 5v14M5 12h14',
      chev: 'M6 9l6 6 6-6',
      cloudok: 'M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 9a4.75 4.75 0 0 1-.3 9.5ZM9.5 13.75l2 2 3.5-3.5',
      copy: 'M8.5 8.5h11v11h-11zM15.5 8.5v-4h-11v11h4',
      folder: 'M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5Z',
      sort: 'M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5',
      laptop: 'M5 6h14v10H5zM2.5 19h19',
      monitor: 'M3.5 4.5h17v11h-17zM9 19.5h6M12 15.5v4'
    };
    const dots = { '开心': '#F2B705', '无语': '#8A8A8A', '生气': '#E5484D', '打工': '#3E7BFA', '回复': '#2BA471', '晚安': '#7A5AF8', '猫猫': '#E8572A', '熊熊': '#A0662F', '兔兔': '#F49AC2', '豆豆': '#C99A6B', '冷笑话': '#0E8A8F' };
    const dress = (s) => Object.assign(s, {
      pick: () => this.setState({ sel: s.k }),
      ring: s.k === sel ? '0 0 0 2px #FFFFFF, 0 0 0 4px ' + accent : 'none'
    });
    const lib = [
      { label: '全部表情', count: '1,284', icon: ic.grid, bg: '#FFFFFF', weight: 600 },
      { label: '最近使用', count: '48', icon: ic.clock, bg: 'transparent', weight: 500 },
      { label: '收藏', count: '86', icon: ic.star, bg: 'transparent', weight: 500 },
      { label: '未打标签', count: '37', icon: ic.inbox, bg: 'transparent', weight: 500 },
      { label: '最近删除', count: '5', icon: ic.trash, bg: 'transparent', weight: 500 }
    ];
    const groups = [
      { name: '情绪', chev: ic.chev, tags: [{ n: '开心', c: '212' }, { n: '无语', c: '97' }, { n: '生气', c: '41' }] },
      { name: '场景', chev: ic.chev, tags: [{ n: '打工', c: '156' }, { n: '回复', c: '203' }, { n: '晚安', c: '28' }] },
      { name: '角色', chev: ic.chev, tags: [{ n: '猫猫', c: '318' }, { n: '熊熊', c: '74' }] },
      { name: '未分组', chev: ic.chev, tags: [{ n: '冷笑话', c: '12' }] }
    ];
    groups.forEach((g) => g.tags.forEach((t) => { t.dot = dots[t.n]; }));
    const grid = [];
    for (let i = 0; i < 24; i++) grid.push(dress(this.mk(i)));
    const recent = [3, 17, 8, 21, 12, 5, 30, 14, 26, 9].map((k) => dress(this.mk(k)));
    const cur = this.mk(sel);
    const caps = (this.state && this.state.caps) || {};
    const capText = caps[sel] != null ? caps[sel] : (cur.hasCap ? cur.cap : '');
    return {
      accent: accent, ic: ic, lib: lib, groups: groups, grid: grid, recent: recent, cur: cur, capText: capText,
      onCap: (e) => { const next = Object.assign({}, caps); next[sel] = e.target.value; this.setState({ caps: next }); },
      curTags: cur.tags.map((n) => ({ n: n, dot: dots[n] })),
      devices: [
        { name: 'MacBook Air · 本机', when: '刚刚', icon: ic.laptop },
        { name: '办公室台式机 · Windows', when: '12 分钟前', icon: ic.monitor },
        { name: '家里的 ThinkPad', when: '昨天 22:41', icon: ic.laptop }
      ]
    };
  }
}
</script>
