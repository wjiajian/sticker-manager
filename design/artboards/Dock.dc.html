<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>悬浮球展开面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1F1F}a:hover{color:#B8431C}
.btn,.tile,.chip,.ball{transition:transform 500ms cubic-bezier(0.22,1,0.36,1),opacity 300ms cubic-bezier(0.22,1,0.36,1)}
.btn:hover,.chip:hover{opacity:0.82}
.tile:hover{transform:translateY(-2px)}
.ball:hover{transform:scale(1.06)}
.btn:active,.tile:active,.chip:active,.ball:active{transform:scale(0.96)}
.btn:focus-visible,.tile:focus-visible,.chip:focus-visible,.ball:focus-visible,input:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
input::placeholder{color:#6B6A66}
@media (prefers-reduced-motion: reduce){.btn,.tile,.chip,.ball{transition:opacity 300ms cubic-bezier(0.22,1,0.36,1)}.tile:hover,.ball:hover,.btn:active,.tile:active,.chip:active,.ball:active{transform:none}}
</style>
</helmet>
<div style="position: relative; min-height: 800px; overflow: hidden; background: #E7E5DF; color: #1F1F1F; font-family: Manrope, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 20px">

<section aria-label="聊天窗口示意" style="position: absolute; left: 64px; top: 64px; width: 560px; max-width: calc(100% - 128px); height: 672px; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 12px; box-shadow: 0 16px 48px rgba(31, 31, 31, 0.12); overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #F5F4F0">
<div style="display: flex; gap: 8px">
<span style="width: 12px; height: 12px; border-radius: 9999px; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 9999px; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 9999px; background: #28C840"></span>
</div>
<span style="flex: 1; text-align: center; font-weight: 600">产品评审小组 · 8 人</span>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">任意聊天应用</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px">
<sc-for list="{{msgs}}" as="g" hint-placeholder-count="4">
<div style="display: flex; gap: 12px; flex-direction: {{g.dir}}; align-items: flex-start">
<span style="flex: 0 0 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{g.av}}; font-size: 12px; line-height: 16px; font-weight: 600">{{g.who}}</span>
<sc-if value="{{g.isText}}" hint-placeholder-val="{{ true }}"><span style="max-width: 320px; padding: 8px 12px; border-radius: 12px; background: {{g.bg}}">{{g.text}}</span></sc-if>
<sc-if value="{{g.isSticker}}" hint-placeholder-val="{{ false }}">
<span style="width: 88px; height: 88px; padding: 8px; box-sizing: border-box">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" role="img" aria-label="表情">
<path d="{{g.s.ears}}" fill="{{g.s.c}}" stroke="#1F1F1F" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{g.s.c}}" stroke="#1F1F1F" stroke-width="2.5"></circle>
<path d="{{g.s.e}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{g.s.m}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</sc-if>
</div>
</sc-for>
</div>
<div style="margin: 0 16px 16px; height: 80px; border: 1px solid #E2E0D9; border-radius: 8px"></div>
</section>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<section aria-label="表情面板" style="position: absolute; right: 88px; top: 136px; width: 360px; max-width: calc(100% - 104px); display: flex; flex-direction: column; gap: 12px; padding: 12px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 24px 64px rgba(31, 31, 31, 0.18), 0 0 0 1px rgba(31, 31, 31, 0.06); box-sizing: border-box">

<div style="display: flex; gap: 8px; align-items: center">
<label style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #F3F2EE; border-radius: 12px; box-shadow: 0 0 0 2px {{accent}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.search}}"></path></svg>
<input aria-label="搜索表情" placeholder="直接输入即可搜索" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: #1F1F1F">
</label>
<button class="btn" type="button" aria-label="固定面板" aria-pressed="false" style="display: flex; padding: 8px; border: 0; border-radius: 12px; background: #F3F2EE; color: #4A4945; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.pin}}"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #4A4945">最近使用</h2>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">按数字键直接复制</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{recent}}" as="s" hint-placeholder-count="8">
<button class="tile" type="button" aria-label="{{s.name}}" style="position: relative; width: 100%; aspect-ratio: 1; padding: 12px; border: 0; border-radius: 8px; background: #F3F2EE; cursor: pointer; box-shadow: {{s.ring}}">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" aria-hidden="true">
<path d="{{s.ears}}" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5"></circle>
<path d="{{s.blush}}" fill="#FF7A9A" opacity="0.55"></path>
<path d="{{s.e}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{s.m}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span style="position: absolute; top: 4px; left: 4px; min-width: 16px; padding: 0 4px; border-radius: 4px; background: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 600; color: #4A4945; box-sizing: border-box">{{s.key}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<button class="chip" type="button" style="flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 4px 12px; border: 1px solid {{t.line}}; border-radius: 9999px; background: {{t.bg}}; font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; color: {{t.fg}}; cursor: pointer">
<span style="width: 8px; height: 8px; border-radius: 9999px; background: {{t.dot}}"></span>{{t.n}}
</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="s" hint-placeholder-count="8">
<button class="tile" type="button" aria-label="{{s.name}}" style="position: relative; width: 100%; aspect-ratio: 1; padding: 12px; border: 0; border-radius: 8px; background: #F3F2EE; cursor: pointer">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" aria-hidden="true">
<path d="{{s.ears}}" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{s.c}}" stroke="#1F1F1F" stroke-width="2.5"></circle>
<path d="{{s.blush}}" fill="#FF7A9A" opacity="0.55"></path>
<path d="{{s.e}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{s.m}}" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<sc-if value="{{s.gif}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; right: 4px; padding: 0 4px; border-radius: 4px; background: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 600">GIF</span></sc-if>
</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #F5F4F0; border-radius: 12px; font-size: 12px; line-height: 16px; color: #4A4945">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E8A4C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.cloudok}}"></path></svg>
<span style="flex: 1">单击复制 · 拖出发送 · Esc 收起</span>
<a href="Main.dc.html" style="font-weight: 600; text-decoration: none">主窗口</a>
</div>

<div aria-hidden="true" style="position: absolute; left: -184px; top: 72px; width: 168px; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 16px 40px rgba(31, 31, 31, 0.16), 0 0 0 1px rgba(31, 31, 31, 0.06); box-sizing: border-box">
<div style="aspect-ratio: 1; padding: 16px; border-radius: 8px; background: #F3F2EE; box-sizing: border-box">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%">
<path d="{{hov.ears}}" fill="{{hov.c}}" stroke="#1F1F1F" stroke-width="2" stroke-linejoin="round"></path>
<circle cx="32" cy="36" r="22" fill="{{hov.c}}" stroke="#1F1F1F" stroke-width="2"></circle>
<path d="{{hov.blush}}" fill="#FF7A9A" opacity="0.55"></path>
<path d="{{hov.e}}" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{hov.m}}" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span style="font-size: 12px; line-height: 16px; font-weight: 600">{{hov.name}}</span>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">用过 37 次 · 猫猫 开心</span>
</div>
</section>
</sc-if>

<button class="ball" type="button" aria-label="{{ballLabel}}" aria-expanded="{{expanded}}" onClick="{{toggle}}" style="position: absolute; right: 16px; top: 372px; width: 56px; height: 56px; padding: 8px; border: 0; border-radius: 9999px; background: #FFFFFF; cursor: pointer; box-shadow: 0 8px 24px rgba(31, 31, 31, 0.2), 0 0 0 {{ringW}} {{accent}}">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" aria-hidden="true">
<circle cx="32" cy="34" r="24" fill="#FFC94A" stroke="#1F1F1F" stroke-width="3"></circle>
<path d="M21 31q4 -5 8 0M35 31q4 -5 8 0" fill="none" stroke="#1F1F1F" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M24 41q8 8 16 0" fill="none" stroke="#1F1F1F" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#15803D","#1F1F1F"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  mk(k) {
    const C = ['#FFC94A','#FF8A5B','#7CC6FE','#9BE38E','#F49AC2','#C7B8FF','#EDEBE4','#C99A6B'];
    const EY = ['M25 30v3M39 30v3','M21 33q4 -5 8 0M35 33q4 -5 8 0','M21 32h8M35 32h8','M22 29l6 6M28 29l-6 6M36 29l6 6M42 29l-6 6','M25 30v3M35 33q4 -5 8 0','M21 31q4 3 8 0M35 31q4 3 8 0'];
    const MO = ['M25 42q7 7 14 0','M24 41h16q-1 8 -8 8t-8 -8Z','M27 45h10','M29 45a3 3 0 1 0 6 0a3 3 0 1 0 -6 0','M25 48q7 -6 14 0','M23 45q2.25 -3 4.5 0t4.5 0t4.5 0t4.5 0'];
    const EA = ['','M13 28l3 -18l13 9ZM51 28l-3 -18l-13 9Z','M11 20a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M39 20a7 7 0 1 0 14 0a7 7 0 1 0 -14 0','M20 18q-4 -16 3 -16q5 0 4 16ZM44 18q4 -16 -3 -16q-5 0 -4 16Z'];
    const AN = ['豆豆','猫猫','熊熊','兔兔'];
    const AC = ['点头','比心','发呆','鼓掌','叹气','转圈','偷看','躺平','捂脸','举手'];
    const a = (k * 3) % 4, gif = k % 5 === 2;
    return {
      k: k, c: C[(k * 3) % 8], e: EY[(k * 5 + 1) % 6], m: MO[(k + 2) % 6], ears: EA[a],
      blush: k % 3 === 0 ? 'M15 41a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M43 41a3 3 0 1 0 6 0a3 3 0 1 0 -6 0' : '',
      gif: gif, name: AN[a] + AC[(k * 7) % 10] + (gif ? '.gif' : '.png')
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const open = (this.state && this.state.open != null) ? this.state.open : true;
    const ic = {
      search: 'M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15ZM16 16l5 5',
      pin: 'M9 3.5h6l-1 6 3 3H7l3-3ZM12 12.5v8',
      cloudok: 'M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.8 9a4.75 4.75 0 0 1-.3 9.5ZM9.5 13.75l2 2 3.5-3.5'
    };
    const recent = [7, 17, 8, 21, 12, 5, 30, 14].map((k, i) => Object.assign(this.mk(k), {
      key: String(i + 1), ring: i === 0 ? '0 0 0 2px #FFFFFF, 0 0 0 4px ' + accent : 'none'
    }));
    const cats = [3, 11, 15, 19, 23, 27, 31, 35].map((k) => this.mk(k));
    const tagList = [['猫猫', '#E8572A'], ['回复', '#2BA471'], ['开心', '#F2B705'], ['打工', '#3E7BFA'], ['无语', '#8A8A8A'], ['晚安', '#7A5AF8']];
    const tags = tagList.map((t, i) => ({ n: t[0], dot: t[1], bg: i === 0 ? '#1F1F1F' : '#FFFFFF', fg: i === 0 ? '#FFFFFF' : '#1F1F1F', line: i === 0 ? '#1F1F1F' : '#E2E0D9' }));
    const other = '#F3F2EE', me = '#FBE3D6';
    const msgs = [
      { who: '林', av: '#F9D9C9', dir: 'row', isText: true, isSticker: false, bg: other, text: '评审改到周五下午三点，大家看下时间' },
      { who: '周', av: '#CDE8D6', dir: 'row', isText: true, isSticker: false, bg: other, text: '可以，我那天下午都空着' },
      { who: '我', av: '#E2E0D9', dir: 'row-reverse', isText: true, isSticker: false, bg: me, text: '收到，我把交互稿再过一遍' },
      { who: '我', av: '#E2E0D9', dir: 'row-reverse', isText: false, isSticker: true, s: this.mk(7) }
    ];
    msgs.forEach((g) => { if (!g.s) g.s = this.mk(0); });
    return {
      accent: accent, ic: ic, open: open, recent: recent, cats: cats, tags: tags, msgs: msgs, hov: this.mk(7),
      expanded: open ? 'true' : 'false', ballLabel: open ? '收起表情面板' : '展开表情面板', ringW: open ? '3px' : '0px',
      toggle: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
