<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>悬浮球状态</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1F1F}a:hover{color:#B8431C}
</style>
</helmet>
<div style="width: 1280px; height: 560px; display: flex; flex-direction: column; gap: 32px; padding: 48px; background: #FFFFFF; color: #1F1F1F; font-family: Manrope, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 20px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 600">悬浮球</h1>
<span style="color: #6B6A66">直径 56，常驻屏幕边缘；单击展开面板，拖动可移动，把图片拖到球上即导入</span>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{states}}" as="st" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; height: 240px; display: flex; align-items: center; justify-content: center; background: #F5F4F0; border-radius: 16px; overflow: hidden">
<sc-if value="{{st.edge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: #D9D7D0"></span></sc-if>
<span style="position: relative; width: {{st.size}}; height: {{st.size}}; padding: 8px; border-radius: 9999px; background: #FFFFFF; box-sizing: border-box; box-shadow: {{st.shadow}}; transform: {{st.tf}}; opacity: {{st.op}}">
<svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%" aria-hidden="true">
<circle cx="32" cy="34" r="24" fill="#FFC94A" stroke="#1F1F1F" stroke-width="3"></circle>
<path d="{{st.eyes}}" fill="none" stroke="#1F1F1F" stroke-width="3.5" stroke-linecap="round"></path>
<path d="{{st.mouth}}" fill="none" stroke="#1F1F1F" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
<sc-if value="{{st.ring}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 64 64" style="position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg)" aria-hidden="true">
<circle cx="32" cy="32" r="30" fill="none" stroke="#E2E0D9" stroke-width="3"></circle>
<circle cx="32" cy="32" r="30" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="120 189"></circle>
</svg>
</sc-if>
<sc-if value="{{st.badge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -4px; right: -4px; min-width: 24px; padding: 2px 4px; border-radius: 9999px; background: {{accent}}; color: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 700; text-align: center; box-sizing: border-box; box-shadow: 0 0 0 2px #FFFFFF">12</span></sc-if>
<sc-if value="{{st.drop}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: -12px; border: 2px dashed {{accent}}; border-radius: 9999px"></span></sc-if>
</span>
<sc-if value="{{st.tip}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; bottom: 32px; padding: 4px 8px; border-radius: 8px; background: #1F1F1F; color: #FFFFFF; font-size: 12px; line-height: 16px; white-space: nowrap">{{st.tipText}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<span style="font-weight: 600">{{st.name}}</span>
<span style="font-size: 12px; line-height: 16px; color: #6B6A66">{{st.desc}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#15803D","#1F1F1F"]},"$preview":{"width":1280,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const happy = 'M21 31q4 -5 8 0M35 31q4 -5 8 0', dots = 'M25 29v3M39 29v3', sleepy = 'M21 31h8M35 31h8';
    const smile = 'M24 41q8 8 16 0', open = 'M26 40q6 10 12 0Z', flat = 'M27 43h10';
    const base = { size: '56px', shadow: '0 8px 24px rgba(31, 31, 31, 0.18)', tf: 'none', op: 1, eyes: happy, mouth: smile, edge: false, ring: false, badge: false, drop: false, tip: false, tipText: '' };
    const states = [
      { name: '默认', desc: '白底圆形，阴影让它浮在任何窗口之上' },
      { name: '悬停', desc: '放大并提示操作，表情眨眼回应', tf: 'scale(1.1)', eyes: dots, tip: true, tipText: '单击展开 · 右键更多' },
      { name: '贴边收起', desc: '静止 3 秒后吸附边缘，只露出一半', edge: true, tf: 'translateX(68px)', op: 0.7, eyes: sleepy, mouth: flat },
      { name: '同步中', desc: '外圈显示进度，完成后淡出', ring: true },
      { name: '有新表情', desc: '其他设备同步来的新表情数量', badge: true, eyes: dots, mouth: open },
      { name: '拖入图片', desc: '变大并出现虚线圈，松开即导入', size: '72px', drop: true, eyes: dots, mouth: open, tip: true, tipText: '松开导入 3 张' }
    ].map((s) => Object.assign({}, base, s));
    return { accent: accent, states: states };
  }
}
</script>
</body>
</html>
