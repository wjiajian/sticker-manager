<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A3C"/><stop offset="1" stop-color="#121212"/></linearGradient>
<linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#FFC94A" stop-opacity=".30"/><stop offset="1" stop-color="#FFC94A" stop-opacity="0"/></radialGradient>
<radialGradient id="ball" cx=".36" cy=".28" r=".85"><stop offset="0" stop-color="#FFEBA8"/><stop offset=".45" stop-color="#FFC94A"/><stop offset="1" stop-color="#E9970F"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D7D0"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>
<linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".4" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".30"/></linearGradient>
<clipPath id="above"><rect x="0" y="0" width="1024" height="500"/></clipPath>
<clipPath id="panel"><path d="M232 530H792V744Q792 800 736 800H288Q232 800 232 744Z"/></clipPath>
<clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="inner" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="dropTile" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="22" result="b"/><feFlood flood-color="#000" flood-opacity="0.45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="dropBall" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="14" result="b"/><feFlood flood-color="#7a4a00" flood-opacity="0.4"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="dropRim" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="16" result="b"/><feFlood flood-color="#000" flood-opacity="0.45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#dropTile)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/></g>
<rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>
<g clip-path="url(#tileClip)"><ellipse cx="512" cy="430" rx="360" ry="300" fill="url(#glow)"/></g>
<!-- 仓内：脸在仓沿上方是实的 -->
<g clip-path="url(#above)">
  <g filter="url(#dropBall)"><circle cx="512" cy="440" r="216" fill="url(#ball)"/></g>
  <ellipse cx="450" cy="352" rx="92" ry="48" fill="#fff" opacity=".42" transform="rotate(-24 450 352)" filter="url(#inner)"/>
  <g transform="translate(512 440) scale(9) translate(-32 -33.2)" fill="none" stroke="#fff" stroke-opacity=".5" stroke-linecap="round" stroke-width="3.5"><path d="M21 31q4 -5 8 0M35 31q4 -5 8 0"/><path d="M24 41q8 8 16 0"/></g><g transform="translate(512 440) scale(9) translate(-32 -34)" fill="none" stroke="#1F1F1F" stroke-linecap="round" stroke-width="3.5"><path d="M21 31q4 -5 8 0M35 31q4 -5 8 0"/><path d="M24 41q8 8 16 0"/></g>
</g>
<!-- 磨砂玻璃前壁：仓内的脸模糊透出来 -->
<g clip-path="url(#panel)">
  <rect x="232" y="530" width="560" height="270" fill="#1d1d1f"/>
  <g filter="url(#blur)" opacity=".85"><circle cx="512" cy="440" r="216" fill="url(#ball)"/><g transform="translate(512 440) scale(9) translate(-32 -34)" fill="none" stroke="#1F1F1F" stroke-linecap="round" stroke-width="3.5"><path d="M21 31q4 -5 8 0M35 31q4 -5 8 0"/><path d="M24 41q8 8 16 0"/></g></g>
  <rect x="232" y="530" width="560" height="270" fill="url(#glass)"/>
</g>
<path d="M232 530H792V744Q792 800 736 800H288Q232 800 232 744Z" fill="none" stroke="url(#glassEdge)" stroke-width="5"/>
<rect x="440" y="648" width="144" height="30" rx="15" fill="#000" opacity=".38"/>
<rect x="440" y="648" width="144" height="30" rx="15" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" transform="translate(0 3)" clip-path="url(#panel)"/>
<!-- 仓沿：不透明的亮色圆边，压在玻璃上 -->
<g filter="url(#dropRim)"><rect x="192" y="466" width="640" height="84" rx="42" fill="url(#rim)"/></g>
<rect x="192" y="466" width="640" height="84" rx="42" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3"/>
<path d="M232 480Q512 462 792 480" fill="none" stroke="#fff" stroke-opacity=".0"/>
</svg>