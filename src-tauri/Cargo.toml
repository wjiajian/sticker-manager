[package]
name = "sticker-manager"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# 库名和可执行文件名不能相同，否则 Windows 上调试符号文件会冲突
[lib]
name = "sticker_manager_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
sticker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.4.1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "=2.1.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
