[package]
name = "sticker-manager"
version = "0.1.7"
edition.workspace = true
publish.workspace = true
license.workspace = true

# 库名和可执行文件名不能相同，否则 Windows 上调试符号文件会冲突
[lib]
name = "sticker_manager_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json = "1"
sticker-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.4.1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
thiserror.workspace = true
sha2 = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
tauri-nspanel = "=2.1.1"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSScreen", "NSWindow", "NSGraphics", "NSAlert", "NSButton", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4"
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"]
