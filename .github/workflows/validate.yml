name: 验证应用

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: node --test frontend/tests/ballSizePreview.test.mjs
      - run: pnpm --dir frontend build
      - run: cargo fmt --all --check
      - if: runner.os == 'Windows'
        run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm --dir frontend tauri build --debug --no-bundle
      - if: runner.os == 'Windows'
        run: node .github/scripts/ball-window.test.mjs
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ball-window-results
          path: target/ball-window-results
          if-no-files-found: ignore
          retention-days: 7
      - if: runner.os == 'macOS'
        run: swiftc -typecheck scripts/diagnose-macos-drag.swift
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website build
      - run: git diff --check
