name: 构建 macOS 安装包

on:
  workflow_dispatch:
    inputs:
      release:
        description: 发布到 Release（tag 为 v + package.json 版本号）
        type: boolean
        default: false

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # CI=true 跳过 DMG 的访达窗口美化
      - run: CI=true pnpm tauri build --bundles dmg

      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sticker-manager-${{ steps.version.outputs.value }}-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Release 已存在时只覆盖上传 DMG，不改说明
      - if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" target/release/bundle/dmg/*.dmg --clobber
          else
            gh release create "$TAG" target/release/bundle/dmg/*.dmg --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
