name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Install Android SDK
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: node tool/verify_project.mjs
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build macOS and package app bundle
        if: matrix.platform == 'macos'
        run: bash tool/build_macos.sh
      - name: Test native macOS clipboard
        if: matrix.platform == 'macos'
        run: >-
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release --no-pub
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/sticker-manager-windows-x64.zip
          Compress-Archive -Path tool/release/README_FIRST.txt, tool/release/Start-StickerManager.cmd -DestinationPath dist/sticker-manager-windows-x64.zip -Update
      - name: Build Android test APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --no-pub
      - name: Upload desktop bundle
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: sticker-manager-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload Android test APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: sticker-manager-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
